<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匕首之心 // 战局面板</title>
  <style>
    /* ==========================================================================
       瑞士主义极简设计系统 (SWISS MINIMALIST STYLE)
       - 严谨几何网格与极简无衬线版式
       - 纯黑白基底 + 信号红（恐惧/警报）与群青蓝（希望/焦点）
       - 左右对称记录栏 (房间流水 + 掷骰流水)
       - 宽屏大字号高信息密度
       ========================================================================== */

    :root {
      --bg: #F4F4F0;
      --surface: #FFFFFF;
      --surface-subtle: #ECECE7;
      --surface-active: #E0E0DA;
      --ink: #0A0A0A;
      --ink-secondary: #4A4A45;
      --ink-muted: #888882;
      
      --red: #E6332A;
      --red-hover: #C5241C;
      --red-subtle: #FDEEEC;
      --blue: #004BD6;
      --blue-subtle: #EDF3FD;

      --border: #111111;
      --border-subtle: #D0D0C8;

      --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Inter", "Arial", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--border);
      outline-offset: 1px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 0;
      transition: background 0.1s, color 0.1s;
    }

    button:hover:not(:disabled) {
      background: var(--ink);
      color: var(--surface);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    input, select, textarea {
      font-family: inherit;
      font-size: 15px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 10px;
      border-radius: 0;
    }

    /* 宽幅屏幕容器 */
    .swiss-container {
      width: 98vw;
      max-width: 1880px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 顶部控制栏 */
    .masthead {
      border-bottom: 2px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .masthead-inner {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      min-height: 64px;
    }

    .masthead-left {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px;
      border-right: 1px solid var(--border);
    }

    .brand-logo {
      background: var(--ink);
      color: var(--surface);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 900;
      padding: 6px 12px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
    }

    .masthead-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 24px;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
    }

    .masthead-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-left: 1px solid var(--border);
    }

    .btn-xcard {
      color: var(--red);
      border-color: var(--red);
      font-weight: 800;
    }

    .btn-xcard:hover {
      background: var(--red) !important;
      color: #fff !important;
    }

    .btn-xcard.active {
      background: var(--red) !important;
      color: #fff !important;
    }

    .xcard-alert-bar {
      display: none;
      background: var(--red);
      color: #fff;
      padding: 14px 20px;
      text-align: center;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 0.05em;
      border-bottom: 2px solid var(--ink);
    }

    .xcard-alert-bar.show {
      display: block;
    }

    /* 模块分段标题 */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 24px 0 10px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    /* ==========================================================================
       模块一：状态 (恐惧点 + 倒计时)
       ========================================================================== */
    .status-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    @media (max-width: 1000px) {
      .status-grid { grid-template-columns: 1fr; }
    }

    /* 恐惧卡 */
    .fear-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .fear-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--red);
    }

    .fear-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .fear-title {
      font-size: 24px;
      font-weight: 900;
    }

    .fear-val-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 12px 0 16px;
    }

    .fear-num {
      font-family: var(--font-mono);
      font-size: 68px;
      font-weight: 900;
      line-height: 0.9;
      color: var(--red);
      letter-spacing: -0.04em;
    }

    .fear-max {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    /* 恐惧点阵 */
    .fear-pips {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
      height: 20px;
      margin-bottom: 20px;
      background: var(--surface-subtle);
      padding: 4px;
      border: 1px solid var(--border-subtle);
    }

    .fear-pip {
      border: 1px solid var(--border-subtle);
      background: transparent;
      transition: background 0.1s;
    }

    .fear-pip.filled {
      background: var(--red);
      border-color: var(--red);
    }

    .fear-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .fear-btn {
      height: 42px;
      font-size: 15px;
      font-weight: 800;
    }

    .fear-btn--plus {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .fear-btn--plus:hover {
      background: var(--red-hover) !important;
    }

    .fear-presets {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .fear-presets button {
      flex: 1;
      padding: 6px 0;
      font-size: 13px;
      background: transparent;
      border-color: var(--border-subtle);
      color: var(--ink-secondary);
    }

    /* 倒计时面板 */
    .clocks-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .clocks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .clocks-title {
      font-size: 22px;
      font-weight: 900;
    }

    .clocks-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
      flex: 1;
    }

    .clock-item {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .clock-item.triggered {
      border-color: var(--red);
      background: var(--red-subtle);
    }

    .clock-item-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .clock-name {
      font-size: 16px;
      font-weight: 900;
    }

    .clock-ratio {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 900;
      white-space: nowrap;
    }

    .clock-track {
      display: flex;
      gap: 4px;
      height: 16px;
      margin-bottom: 14px;
    }

    .clock-slot {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .clock-slot.filled {
      background: var(--ink);
    }

    .clock-item.triggered .clock-slot.filled {
      background: var(--red);
      border-color: var(--red);
    }

    .clock-item-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .clock-steppers {
      display: flex;
      gap: 4px;
    }

    .clock-steppers button {
      min-width: 34px;
      height: 32px;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 900;
    }

    .clock-del-btn {
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--ink-secondary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 8px;
    }

    .clock-del-btn:hover {
      border-color: var(--red);
      color: var(--red);
      background: transparent !important;
    }

    .clock-badge-triggered {
      display: none;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
    }

    .clock-item.triggered .clock-badge-triggered {
      display: inline-block;
    }

    .clock-new-box {
      border: 1px dashed var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      background: var(--surface-subtle);
      cursor: pointer;
      min-height: 115px;
      font-weight: 800;
      font-size: 15px;
    }

    .clock-new-box:hover {
      background: var(--surface-active);
      border-color: var(--ink);
    }

    /* ==========================================================================
       模块二：玩家 (一行四张卡)
       ========================================================================== */
    .player-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (max-width: 1400px) {
      .player-cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 768px) {
      .player-cards-grid { grid-template-columns: 1fr; }
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .player-card-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .player-title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .player-name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .player-sub {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink-secondary);
    }

    /* 角色移除警示按钮 (边框 + 红色底) */
    .btn-remove-player {
      background: var(--red);
      color: #fff;
      border: 1px solid var(--red);
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
    }

    .btn-remove-player:hover {
      background: var(--red-hover) !important;
      border-color: var(--red-hover) !important;
      color: #fff !important;
    }

    /* 快捷资源调控 */
    .player-resources {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 10px;
      background: #FAF9F6;
    }

    .track-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .track-name-box {
      min-width: 76px;
      display: flex;
      flex-direction: column;
    }

    .track-title {
      font-size: 13px;
      font-weight: 800;
    }

    .track-title--blue {
      color: var(--blue);
    }

    .track-fraction {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-muted);
      font-weight: 700;
    }

    /* 希望点数调控 */
    .hope-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hope-number {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 900;
      color: var(--blue);
      min-width: 32px;
      text-align: center;
      line-height: 1;
    }

    .hope-diamonds {
      display: flex;
      gap: 4px;
    }

    .hope-diamond {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      transform: rotate(45deg);
    }

    .hope-diamond.active {
      background: var(--blue);
      border-color: var(--blue);
    }

    .track-steppers {
      display: flex;
      gap: 3px;
    }

    .track-steppers button {
      width: 30px;
      height: 30px;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 800;
    }

    /* 方格标记槽 */
    .slots-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex: 1;
      justify-content: flex-end;
    }

    .slot-box {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      padding: 0;
    }

    .slot-box:hover {
      background: var(--surface-active);
    }

    .slot-box.marked {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .slot-box--stress.marked {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .slot-box--armor.marked {
      background: var(--ink-secondary);
      color: #fff;
      border-color: var(--ink-secondary);
    }

    /* 防御数值 */
    .defenses-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .defense-cell {
      padding: 8px 6px;
      border-right: 1px solid var(--border);
      text-align: center;
      background: var(--surface);
    }

    .defense-cell:last-child {
      border-right: none;
    }

    .defense-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .defense-val {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 900;
      margin-top: 2px;
    }

    /* 六属性 */
    .attributes-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-bottom: 1px solid var(--border);
    }

    .attr-cell {
      padding: 8px 2px;
      border-right: 1px solid var(--border);
      text-align: center;
      background: var(--surface);
      cursor: pointer;
    }

    .attr-cell:last-child {
      border-right: none;
    }

    .attr-cell:hover {
      background: var(--ink);
      color: #fff;
    }

    .attr-cell:hover .attr-name {
      color: #bbb;
    }

    .attr-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .attr-val {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 900;
      margin-top: 2px;
    }

    /* 武器条目 */
    .weapons-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #FCFCFA;
    }

    .weapon-btn {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
    }

    .weapon-btn:hover {
      border-color: var(--border);
      background: var(--surface-subtle);
    }

    .weapon-dmg {
      font-family: var(--font-mono);
      color: var(--red);
      font-weight: 800;
    }

    /* 卡片底栏 (仅保留完整信息) */
    .player-card-foot {
      padding: 10px 14px;
      display: flex;
      background: var(--surface);
    }

    .btn-detail {
      width: 100%;
      height: 38px;
      font-weight: 800;
      background: var(--ink);
      color: #fff;
    }

    .btn-detail:hover {
      background: var(--blue) !important;
      border-color: var(--blue);
    }

    /* ==========================================================================
       模块三：掷骰 (对称三栏：房间记录 + 掷骰操作 + 掷骰记录)
       ========================================================================== */
    .dice-layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr) 380px;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 1380px) {
      .dice-layout { grid-template-columns: 320px minmax(0, 1fr) 320px; }
    }

    @media (max-width: 1080px) {
      .dice-layout { grid-template-columns: 1fr; }
    }

    .dice-box {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .dice-tabs-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid var(--border);
    }

    .dice-tab-btn {
      padding: 16px 20px;
      border: none;
      background: var(--surface-subtle);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
    }

    .dice-tab-btn.active {
      background: var(--surface);
      box-shadow: inset 0 -3px 0 var(--ink);
    }

    .dice-body {
      padding: 24px;
    }

    /* 二元骰表盘 */
    .duality-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .duality-card {
      border: 2px solid var(--border);
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .duality-card--hope {
      background: var(--blue-subtle);
      border-color: var(--blue);
    }

    .duality-card--fear {
      background: var(--red-subtle);
      border-color: var(--red);
    }

    .duality-card-name {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .duality-card--hope .duality-card-name { color: var(--blue); }
    .duality-card--fear .duality-card-name { color: var(--red); }

    .duality-card-num {
      font-family: var(--font-mono);
      font-size: 84px;
      font-weight: 900;
      line-height: 0.95;
    }

    .duality-card--hope .duality-card-num { color: var(--blue); }
    .duality-card--fear .duality-card-num { color: var(--red); }

    /* 参数配置 */
    .dice-params-grid {
      display: grid;
      grid-template-columns: 140px 180px minmax(0, 1fr);
      gap: 12px;
      background: var(--surface-subtle);
      padding: 16px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 16px;
    }

    .param-unit {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .param-label {
      font-size: 13px;
      font-weight: 800;
    }

    .btn-roll-main {
      width: 100%;
      height: 52px;
      font-size: 18px;
      font-weight: 900;
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .btn-roll-main:hover {
      background: var(--blue) !important;
      border-color: var(--blue);
    }

    /* 结果揭晓 */
    .result-banner {
      border: 2px solid var(--border);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAF9F6;
      margin-top: 18px;
    }

    .result-verdict {
      font-size: 24px;
      font-weight: 900;
    }

    .result-verdict.crit { color: var(--red); }
    .result-verdict.hope { color: var(--blue); }
    .result-verdict.fear { color: var(--red); }

    .result-formula {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink-secondary);
      margin-top: 4px;
    }

    .result-total {
      font-family: var(--font-mono);
      font-size: 54px;
      font-weight: 900;
      line-height: 1;
    }

    /* 普通骰盘 */
    .std-sides-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .std-side-btn {
      padding: 14px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 900;
    }

    .std-side-btn.active {
      background: var(--ink);
      color: #fff;
    }

    .std-result-box {
      border: 1px solid var(--border);
      padding: 24px;
      background: var(--surface-subtle);
      text-align: center;
      margin-top: 16px;
    }

    .std-total-num {
      font-family: var(--font-mono);
      font-size: 60px;
      font-weight: 900;
      line-height: 1;
    }

    .std-breakdown-txt {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--ink-secondary);
      margin-top: 8px;
    }

    /* 对称记录栏 (通用卡片) */
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 600px;
    }

    .history-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-title {
      font-size: 16px;
      font-weight: 900;
    }

    .history-scroll {
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .history-item {
      padding: 10px 14px;
      border: 1px solid var(--border-subtle);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .hist-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .hist-name { font-weight: 800; }
    .hist-time { font-size: 11px; color: var(--ink-muted); }

    .hist-bottom {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .hist-formula { color: var(--ink-secondary); font-size: 12px; }
    .hist-val { font-size: 18px; font-weight: 900; }

    .hist-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 1px 5px;
    }
    .hist-tag--crit { background: var(--red); color: #fff; }
    .hist-tag--hope { background: var(--blue); color: #fff; }
    .hist-tag--fear { background: var(--red); color: #fff; }

    /* ==========================================================================
       模态框通用结构 (MODALS)
       ========================================================================== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.75);
      z-index: 1000;
      padding: 24px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: var(--surface);
      border: 2px solid var(--border);
      width: min(1160px, 100%);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 18px 18px 0px rgba(0, 0, 0, 0.4);
    }

    .modal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 2px solid var(--border);
      background: var(--surface-subtle);
    }

    .modal-bar h2 {
      font-size: 20px;
      font-weight: 900;
    }

    .modal-content {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 完整档案排版 */
    .dossier-hero {
      border: 2px solid var(--border);
      background: var(--ink);
      color: #fff;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .dossier-hero h2 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .dossier-hero p {
      color: #ccc;
      font-size: 15px;
      font-weight: 600;
      margin-top: 4px;
    }

    .dossier-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
    }

    .dossier-strip-cell {
      padding: 14px;
      border-right: 1px solid var(--border);
      text-align: center;
      background: var(--surface);
    }

    .dossier-strip-cell:last-child { border-right: none; }

    .dossier-strip-label { font-size: 12px; font-weight: 700; color: var(--ink-muted); }
    .dossier-strip-val { font-family: var(--font-mono); font-size: 24px; font-weight: 900; margin-top: 4px; }

    .dossier-subhead {
      font-size: 16px;
      font-weight: 900;
      border-bottom: 2px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .dossier-table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      border: 1px solid var(--border);
      background: var(--border);
      gap: 1px;
    }

    .dossier-cell {
      background: var(--surface);
      padding: 12px 16px;
    }

    .dossier-cell dt { font-size: 11px; font-weight: 700; color: var(--ink-muted); }
    .dossier-cell dd { font-size: 15px; font-weight: 800; margin-top: 3px; }

    .dossier-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .card-item {
      border: 1px solid var(--border);
      padding: 16px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-item h4 { font-size: 17px; font-weight: 900; }
    .card-item p { font-size: 13px; color: var(--ink-secondary); line-height: 1.5; white-space: pre-wrap; }

    .narrative-block {
      border: 1px solid var(--border);
      padding: 16px;
      background: var(--surface);
      margin-bottom: 10px;
    }

    .narrative-block h4 { font-size: 13px; font-weight: 900; color: var(--ink-muted); margin-bottom: 6px; }
    .narrative-block p { font-size: 14px; line-height: 1.6; }

    .json-editor {
      width: 100%;
      height: 420px;
      font-family: var(--font-mono);
      font-size: 13px;
      border: 1px solid var(--border);
      background: #111;
      color: #33FF77;
      padding: 14px;
      line-height: 1.45;
      resize: vertical;
    }

    /* 预设选择器 */
    .presets-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .preset-card {
      border: 1px solid var(--border);
      padding: 14px;
      flex: 1;
      cursor: pointer;
      background: var(--surface);
    }

    .preset-card:hover {
      background: var(--surface-subtle);
    }

    .preset-card h4 { font-size: 15px; font-weight: 900; }

    /* 浮动提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--ink);
      color: #fff;
      border: 1px solid var(--border);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      z-index: 2000;
      display: none;
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <!-- X卡全局暂停横幅 -->
  <div id="xcardBar" class="xcard-alert-bar">
    暂停中 · X卡已触发
  </div>

  <!-- 顶栏 -->
  <header class="masthead">
    <div class="swiss-container masthead-inner">
      <div class="masthead-left">
        <div class="brand-logo">DH</div>
        <div class="brand-title">匕首之心</div>
      </div>

      <div class="masthead-meta">
        <div>DH-7049</div>
        <div style="color: var(--blue);">已连接</div>
        <div id="topCharCount">3人</div>
      </div>

      <div class="masthead-actions">
        <button id="btnXCard" class="btn-xcard" type="button">X卡</button>
        <button id="btnOpenImport" type="button" style="background: var(--ink); color:#fff;">+ 导入角色</button>
        <button id="btnResetAll" type="button">重置</button>
        <button id="btnExportAll" type="button">导出</button>
      </div>
    </div>
  </header>

  <main class="swiss-container" style="margin-top: 24px;">

    <!-- ========================================================================
         模块一：状态
         ======================================================================== -->
    <section>
      <div class="section-head">
        <h2 class="section-title">状态</h2>
      </div>

      <div class="status-grid">
        <!-- 恐惧卡 -->
        <div class="fear-card">
          <div class="fear-top">
            <h3 class="fear-title">恐惧</h3>
          </div>

          <div class="fear-val-row">
            <div class="fear-num" id="fearNum">8</div>
            <div class="fear-max">/ <span id="fearMax">12</span></div>
          </div>

          <!-- 12格几何点阵 -->
          <div class="fear-pips" id="fearPips"></div>

          <div class="fear-actions">
            <button type="button" class="fear-btn" id="btnFearMinus" onclick="adjustFear(-1)">− 1</button>
            <button type="button" class="fear-btn fear-btn--plus" id="btnFearPlus" onclick="adjustFear(1)">+ 1</button>
          </div>

          <div class="fear-presets">
            <button type="button" onclick="setFear(0)">0</button>
            <button type="button" onclick="adjustFear(2)">+2</button>
            <button type="button" onclick="adjustFear(4)">+4</button>
            <button type="button" onclick="setFear(12)">12</button>
          </div>
        </div>

        <!-- 倒计时面板 -->
        <div class="clocks-card">
          <div class="clocks-header">
            <h3 class="clocks-title">倒计时</h3>
            <button type="button" onclick="openAddClockModal()">+ 新建</button>
          </div>

          <div class="clocks-list" id="clocksList"></div>
        </div>
      </div>
    </section>

    <!-- ========================================================================
         模块二：玩家 (一行四张卡)
         ======================================================================== -->
    <section>
      <div class="section-head">
        <h2 class="section-title">玩家</h2>
      </div>

      <div class="player-cards-grid" id="playerCardsGrid"></div>
    </section>

    <!-- ========================================================================
         模块三：掷骰 (对称三栏：房间记录 + 掷骰操作 + 掷骰记录)
         ======================================================================== -->
    <section>
      <div class="section-head">
        <h2 class="section-title">掷骰</h2>
      </div>

      <div class="dice-layout">
        <!-- 左栏：房间记录 -->
        <div class="history-card">
          <div class="history-head">
            <h4 class="history-title">房间记录</h4>
            <button type="button" onclick="clearRoomHistory()" style="padding: 4px 8px; font-size: 12px;">清空</button>
          </div>
          <div class="history-scroll" id="roomHistoryScroll"></div>
        </div>

        <!-- 中栏：主控制板 -->
        <div class="dice-box">
          <div class="dice-tabs-bar">
            <button type="button" class="dice-tab-btn active" id="tabBtnDuality" onclick="switchDiceTab('duality')">
              二元骰
            </button>
            <button type="button" class="dice-tab-btn" id="tabBtnStd" onclick="switchDiceTab('standard')">
              普通骰
            </button>
          </div>

          <!-- 二元骰内容 -->
          <div class="dice-body" id="tabContentDuality">
            <div class="duality-board">
              <!-- 希望 -->
              <div class="duality-card duality-card--hope">
                <div class="duality-card-name">希望</div>
                <div class="duality-card-num" id="hopeNum">--</div>
              </div>

              <!-- 恐惧 -->
              <div class="duality-card duality-card--fear">
                <div class="duality-card-name">恐惧</div>
                <div class="duality-card-num" id="fearDieNum">--</div>
              </div>
            </div>

            <!-- 参数设置 -->
            <div class="dice-params-grid">
              <div class="param-unit">
                <label class="param-label" for="dualityMod">加值</label>
                <input type="number" id="dualityMod" value="2" min="-99" max="99">
              </div>
              <div class="param-unit">
                <label class="param-label" for="dualityAdv">优劣</label>
                <select id="dualityAdv">
                  <option value="normal">普通</option>
                  <option value="advantage">优势 (+1d6)</option>
                  <option value="disadvantage">劣势 (-1d6)</option>
                </select>
              </div>
              <div class="param-unit">
                <label class="param-label" for="dualityExtraInput">额外骰</label>
                <input type="text" id="dualityExtraInput" placeholder="例如 d6+2+d8">
              </div>
            </div>

            <button type="button" class="btn-roll-main" id="btnRollDuality">
              掷骰
            </button>

            <!-- 结果栏 -->
            <div class="result-banner" id="dualityResultBanner">
              <div>
                <div class="result-verdict" id="dualityVerdict">等待掷骰</div>
                <div class="result-formula" id="dualityFormula">希望 + 恐惧</div>
              </div>
              <div class="result-total" id="dualityTotal">--</div>
            </div>
          </div>

          <!-- 普通骰内容 -->
          <div class="dice-body" id="tabContentStd" style="display: none;">
            <div class="std-sides-row">
              <button type="button" class="std-side-btn" onclick="selectStdSides(4)">d4</button>
              <button type="button" class="std-side-btn" onclick="selectStdSides(6)">d6</button>
              <button type="button" class="std-side-btn" onclick="selectStdSides(8)">d8</button>
              <button type="button" class="std-side-btn" onclick="selectStdSides(10)">d10</button>
              <button type="button" class="std-side-btn" onclick="selectStdSides(12)">d12</button>
              <button type="button" class="std-side-btn active" onclick="selectStdSides(20)">d20</button>
              <button type="button" class="std-side-btn" onclick="selectStdSides(100)">d100</button>
            </div>

            <div class="dice-params-grid" style="grid-template-columns: 1fr 1fr 1fr;">
              <div class="param-unit">
                <label class="param-label" for="stdCount">数量</label>
                <input type="number" id="stdCount" value="1" min="1" max="20">
              </div>
              <div class="param-unit">
                <label class="param-label" for="stdMod">加值</label>
                <input type="number" id="stdMod" value="0" min="-99" max="99">
              </div>
              <div class="param-unit">
                <label class="param-label" for="stdAdv">模式</label>
                <select id="stdAdv">
                  <option value="normal">普通</option>
                  <option value="advantage">优势 (取高)</option>
                  <option value="disadvantage">劣势 (取低)</option>
                </select>
              </div>
            </div>

            <button type="button" class="btn-roll-main" id="btnRollStd">
              掷骰
            </button>

            <div class="std-result-box">
              <div class="std-total-num" id="stdTotal">--</div>
              <div class="std-breakdown-txt" id="stdFormula">等待掷骰</div>
            </div>
          </div>
        </div>

        <!-- 右栏：掷骰记录 -->
        <div class="history-card">
          <div class="history-head">
            <h4 class="history-title">掷骰记录</h4>
            <button type="button" onclick="clearDiceHistory()" style="padding: 4px 8px; font-size: 12px;">清空</button>
          </div>
          <div class="history-scroll" id="historyScroll"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       模态框一：完整信息
       ========================================================================== -->
  <div class="modal-overlay" id="dossierModal">
    <div class="modal-box">
      <div class="modal-bar">
        <h2 id="dossierTitle">完整信息</h2>
        <div style="display: flex; gap: 8px;">
          <button type="button" id="btnTabSheet" onclick="setDossierTab('sheet')" style="background: var(--ink); color:#fff;">档案</button>
          <button type="button" id="btnTabJson" onclick="setDossierTab('json')">编辑</button>
          <button type="button" onclick="closeDossierModal()">关闭</button>
        </div>
      </div>
      <div class="modal-content" id="dossierContent"></div>
    </div>
  </div>

  <!-- ==========================================================================
       模态框二：导入角色
       ========================================================================== -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-box" style="width: min(800px, 100%);">
      <div class="modal-bar">
        <h2>导入角色</h2>
        <button type="button" onclick="closeImportModal()">关闭</button>
      </div>
      <div class="modal-content">
        <div>
          <div class="presets-row">
            <div class="preset-card" onclick="loadPreset('ranger')">
              <h4>游侠 · 阿岚</h4>
            </div>
            <div class="preset-card" onclick="loadPreset('guardian')">
              <h4>守护者 · 柯林</h4>
            </div>
            <div class="preset-card" onclick="loadPreset('bard')">
              <h4>吟游诗人 · 艾薇拉</h4>
            </div>
          </div>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
            <label style="font-weight: 800;">粘贴角色卡数据</label>
            <label style="font-size: 13px; cursor: pointer; text-decoration: underline;">
              读取文件
              <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="handleImportFile(event)">
            </label>
          </div>
          <textarea id="importTextarea" class="json-editor" placeholder="在此粘贴 mydhcharsheet 导出的 JSON 数据..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" onclick="closeImportModal()">取消</button>
          <button type="button" onclick="submitImport()" style="background: var(--ink); color:#fff;">导入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       模态框三：新建倒计时 (滑块 2-12)
       ========================================================================== -->
  <div class="modal-overlay" id="clockModal">
    <div class="modal-box" style="width: min(440px, 100%);">
      <div class="modal-bar">
        <h2>新建倒计时</h2>
        <button type="button" onclick="closeAddClockModal()">关闭</button>
      </div>
      <div class="modal-content">
        <div style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label style="font-weight: 800; font-size: 13px;">名称</label>
            <input type="text" id="clockNameInput" placeholder="例如：援军抵达" style="width: 100%; margin-top: 6px;">
          </div>
          <div>
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <label style="font-weight: 800; font-size: 13px;">步数</label>
              <div style="display: flex; align-items: baseline; gap: 4px;">
                <span id="clockMaxDisplay" style="font-family: var(--font-mono); font-size: 20px; font-weight: 900; color: var(--blue);">6</span>
                <span style="font-size: 13px; color: var(--ink-muted);">步</span>
              </div>
            </div>
            <input type="range" id="clockMaxRange" min="2" max="12" value="6" step="1" 
              style="width: 100%; margin-top: 10px; cursor: pointer;" 
              oninput="document.getElementById('clockMaxDisplay').textContent = this.value">
            <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted); margin-top: 4px;">
              <span>2</span><span>4</span><span>6</span><span>8</span><span>10</span><span>12</span>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px;">
            <button type="button" onclick="closeAddClockModal()">取消</button>
            <button type="button" onclick="submitClock()" style="background: var(--ink); color:#fff;">创建</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       模态框四：删除倒计时确认
       ========================================================================== -->
  <div class="modal-overlay" id="deleteClockModal">
    <div class="modal-box" style="width: min(420px, 100%);">
      <div class="modal-bar">
        <h2>删除倒计时</h2>
        <button type="button" onclick="closeDeleteClockModal()">关闭</button>
      </div>
      <div class="modal-content">
        <p style="font-size: 16px; font-weight: 700;">
          确定删除倒计时【<span id="delClockNameTarget" style="color: var(--red);"></span>】？
        </p>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" onclick="closeDeleteClockModal()">取消</button>
          <button type="button" onclick="confirmDeleteClock()" style="background: var(--red); color:#fff; border-color: var(--red);">删除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       模态框五：移除角色确认
       ========================================================================== -->
  <div class="modal-overlay" id="deletePlayerModal">
    <div class="modal-box" style="width: min(420px, 100%);">
      <div class="modal-bar">
        <h2>移除角色</h2>
        <button type="button" onclick="closeDeletePlayerModal()">关闭</button>
      </div>
      <div class="modal-content">
        <p style="font-size: 16px; font-weight: 700;">
          确定移除角色【<span id="delPlayerNameTarget" style="color: var(--red);"></span>】？此操作将清空其席位。
        </p>
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
          <button type="button" onclick="closeDeletePlayerModal()">取消</button>
          <button type="button" onclick="confirmDeletePlayer()" style="background: var(--red); color:#fff; border-color: var(--red);">移除</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 浮动提示 -->
  <div class="toast" id="toast"></div>

  <!-- ==========================================================================
       脚本逻辑 (与 mydhcharsheet 数据结构完全兼容)
       ========================================================================== */
  -->
  <script>
    const PRESETS = [
      {
        ruleSetId: "daggerheart",
        name: "阿岚",
        level: "3",
        profession: "游侠",
        subclass: "荒野使徒",
        community: "荒野之民",
        ancestry1: "精灵",
        proficiency: 2,
        hope: 4,
        hopeMax: 6,
        hp: [true, true, false, false, false, false],
        hpMax: 6,
        stress: [true, false, false, false, false, false],
        stressMax: 6,
        armorBoxes: [true, false, false],
        armorMax: 3,
        evasion: "11",
        armorValue: "2",

    const STORAGE_KEY = "DHOL_SWISS_MINIMAL_V2";

    let state = {
      fear: { value: 8, max: 12 },
      xCardActive: false,
      countdowns: [
        { id: "c1", name: "援军抵达", value: 3, max: 4 },
        { id: "c2", name: "仪式反噬", value: 5, max: 6 },
        { id: "c3", name: "遗迹坍塌", value: 2, max: 8 }
      ],
      characters: JSON.parse(JSON.stringify(PRESETS)),
      diceLog: [],
      roomLog: [],
      activeDossierIdx: null,
      dossierTab: "sheet",
      pendingDelClockIdx: null,
      pendingDelPlayerIdx: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.characters) && parsed.characters.length) {
            state.fear = parsed.fear || state.fear;
            state.xCardActive = Boolean(parsed.xCardActive);
            state.countdowns = Array.isArray(parsed.countdowns) ? parsed.countdowns : state.countdowns;
            state.characters = parsed.characters;
            state.diceLog = Array.isArray(parsed.diceLog) ? parsed.diceLog : [];
            state.roomLog = Array.isArray(parsed.roomLog) ? parsed.roomLog : [];
          }
        }
      } catch (e) {
        console.warn(e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          fear: state.fear,
          xCardActive: state.xCardActive,
          countdowns: state.countdowns,
          characters: state.characters,
          diceLog: state.diceLog.slice(0, 50),
          roomLog: state.roomLog.slice(0, 50)
        }));
      } catch (e) {
        console.error(e);
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    /* 房间记录流水 */
    function pushRoomLog(text, tag = "") {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.roomLog.unshift({ text, tag, time });
      if (state.roomLog.length > 50) state.roomLog.pop();
      saveState();
      renderRoomHistory();
    }

    function renderRoomHistory() {
      const scroll = document.getElementById("roomHistoryScroll");
      scroll.innerHTML = "";

      if (state.roomLog.length === 0) {
        scroll.innerHTML = `<div style="color:var(--ink-muted); text-align:center; padding:20px;">暂无记录</div>`;
        return;
      }

      state.roomLog.forEach(item => {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="hist-top">
            <span class="hist-name">${escapeHtml(item.text)}</span>
            <span class="hist-time">${item.time}</span>
          </div>
          ${item.tag ? `<div style="color:var(--ink-muted); font-size:11px;">${escapeHtml(item.tag)}</div>` : ""}
        `;
        scroll.appendChild(div);
      });
    }

    function clearRoomHistory() {
      state.roomLog = [];
      saveState();
      renderRoomHistory();
    }

    /* 恐惧调控 */
    function renderFear() {
      document.getElementById("fearNum").textContent = state.fear.value;
      document.getElementById("fearMax").textContent = state.fear.max;

      const pips = document.getElementById("fearPips");
      pips.innerHTML = "";
      for (let i = 0; i < state.fear.max; i++) {
        const div = document.createElement("div");
        div.className = `fear-pip ${i < state.fear.value ? "filled" : ""}`;
        pips.appendChild(div);
      }

      document.getElementById("btnFearMinus").disabled = state.fear.value <= 0;
      document.getElementById("btnFearPlus").disabled = state.fear.value >= state.fear.max;
    }

    function adjustFear(delta) {
      const oldVal = state.fear.value;
      state.fear.value = Math.max(0, Math.min(state.fear.max, state.fear.value + delta));
      if (oldVal !== state.fear.value) {
        pushRoomLog(`恐惧点 ${oldVal} → ${state.fear.value} (${delta > 0 ? "+" + delta : delta})`);
      }
      saveState();
      renderFear();
    }

    function setFear(val) {
      const oldVal = state.fear.value;
      state.fear.value = Math.max(0, Math.min(state.fear.max, val));
      if (oldVal !== state.fear.value) {
        pushRoomLog(`恐惧点设为 ${state.fear.value}`);
      }
      saveState();
      renderFear();
    }

    /* 倒计时管理 */
    function renderCountdowns() {
      const list = document.getElementById("clocksList");
      list.innerHTML = "";

      state.countdowns.forEach((clock, idx) => {
        const isTriggered = clock.value >= clock.max;
        const item = document.createElement("div");
        item.className = `clock-item ${isTriggered ? "triggered" : ""}`;

        let slots = "";
        for (let i = 0; i < clock.max; i++) {
          slots += `<div class="clock-slot ${i < clock.value ? "filled" : ""}"></div>`;
        }

        item.innerHTML = `
          <div class="clock-item-top">
            <div class="clock-name">${escapeHtml(clock.name)}</div>
            <div style="display:flex; align-items:baseline; gap:8px;">
              <span class="clock-badge-triggered">触发</span>
              <div class="clock-ratio">${clock.value} <small style="font-size:14px;color:var(--ink-muted);">/ ${clock.max}</small></div>
            </div>
          </div>

          <div class="clock-track">
            ${slots}
          </div>

          <div class="clock-item-foot">
            <div class="clock-steppers">
              <button type="button" onclick="adjustClock(${idx}, -1)" ${clock.value <= 0 ? "disabled" : ""}>−</button>
              <button type="button" onclick="adjustClock(${idx}, 1)" ${clock.value >= clock.max ? "disabled" : ""}>+</button>
              <button type="button" onclick="resetClock(${idx})" style="font-size:12px; padding:0 8px;">重置</button>
            </div>
            <button type="button" class="clock-del-btn" onclick="openDeleteClockModal(${idx})">删除</button>
          </div>
        `;
        list.appendChild(item);
      });

      const addBox = document.createElement("div");
      addBox.className = "clock-new-box";
      addBox.onclick = openAddClockModal;
      addBox.innerHTML = `+ 新建倒计时`;
      list.appendChild(addBox);
    }

    function adjustClock(idx, delta) {
      const clock = state.countdowns[idx];
      if (!clock) return;
      clock.value = Math.max(0, Math.min(clock.max, clock.value + delta));
      pushRoomLog(`倒计时【${clock.name}】推进至 ${clock.value}/${clock.max}`);
      saveState();
      renderCountdowns();
      if (clock.value >= clock.max) {
        showToast(`倒计时【${clock.name}】已触发`);
        pushRoomLog(`倒计时【${clock.name}】已满格触发！`);
      }
    }

    function resetClock(idx) {
      const clock = state.countdowns[idx];
      if (clock) {
        clock.value = 0;
        pushRoomLog(`倒计时【${clock.name}】已重置`);
        saveState();
        renderCountdowns();
      }
    }

    /* 倒计时删除弹窗 */
    function openDeleteClockModal(idx) {
      state.pendingDelClockIdx = idx;
      const clock = state.countdowns[idx];
      document.getElementById("delClockNameTarget").textContent = clock ? clock.name : "";
      document.getElementById("deleteClockModal").classList.add("show");
    }

    function closeDeleteClockModal() {
      state.pendingDelClockIdx = null;
      document.getElementById("deleteClockModal").classList.remove("show");
    }

    function confirmDeleteClock() {
      if (state.pendingDelClockIdx !== null) {
        const name = state.countdowns[state.pendingDelClockIdx]?.name || "倒计时";
        state.countdowns.splice(state.pendingDelClockIdx, 1);
        pushRoomLog(`已删除倒计时【${name}】`);
        saveState();
        closeDeleteClockModal();
        renderCountdowns();
      }
    }

    function openAddClockModal() {
      document.getElementById("clockNameInput").value = "";
      document.getElementById("clockMaxRange").value = 6;
      document.getElementById("clockMaxDisplay").textContent = "6";
      document.getElementById("clockModal").classList.add("show");
    }

    function closeAddClockModal() {
      document.getElementById("clockModal").classList.remove("show");
    }

    function submitClock() {
      const name = document.getElementById("clockNameInput").value.trim() || "倒计时";
      const max = parseInt(document.getElementById("clockMaxRange").value, 10) || 6;
      state.countdowns.push({ id: "c" + Date.now(), name, value: 0, max });
      pushRoomLog(`新建倒计时【${name}】(${max}步)`);
      saveState();
      closeAddClockModal();
      renderCountdowns();
    }

    document.getElementById("btnXCard").addEventListener("click", () => {
      state.xCardActive = !state.xCardActive;
      pushRoomLog(state.xCardActive ? "X卡已触发（战局暂停）" : "X卡已解除");

    function adjustHope(cIdx, delta) {
      const char = state.characters[cIdx];
      if (!char) return;
      const oldVal = char.hope;
      char.hope = Math.max(0, Math.min(char.hopeMax || 6, char.hope + delta));

    /* 额外骰算式解析器 (支持 d6+2+d8+d10+4 格式) */
    function parseAndRollExtraDice(str) {
      if (!str || !str.trim()) return { total: 0, partsText: "" };
      const cleaned = str.replace(/\s+/g, "");
      const regex = /([+-]?)(?:(\d*)d(\d+)|(\d+))/gi;
      let match;
      let total = 0;
      let parts = [];

      while ((match = regex.exec(cleaned)) !== null) {
        const sign = match[1] === "-" ? -1 : 1;
        if (match[3]) {
          const count = parseInt(match[2] || "1", 10);
          const sides = parseInt(match[3], 10);
          let sub = 0;
          let rolls = [];
          for (let i = 0; i < count; i++) {
            const r = Math.floor(Math.random() * sides) + 1;
            sub += r;
            rolls.push(r);
          }
          total += sign * sub;
          parts.push(`${sign < 0 ? "-" : "+"}${count > 1 ? count : ""}d${sides}[${rolls.join(",")}]`);
        } else if (match[4]) {
          const val = parseInt(match[4], 10);
          total += sign * val;
          parts.push(`${sign < 0 ? "-" : "+"}${val}`);
        }
      }

      return {
        total,
        partsText: parts.join(" ").replace(/^\+/, "")
      };
    }

    /* 掷骰逻辑 */
    let currentStdSides = 20;

    function switchDiceTab(tab) {
      const btnD = document.getElementById("tabBtnDuality");
      const btnS = document.getElementById("tabBtnStd");
      const conD = document.getElementById("tabContentDuality");
      const conS = document.getElementById("tabContentStd");

      if (tab === "duality") {
        btnD.classList.add("active");
        btnS.classList.remove("active");
        conD.style.display = "block";
        conS.style.display = "none";
      } else {
        btnD.classList.remove("active");
        btnS.classList.add("active");
        conD.style.display = "none";
        conS.style.display = "block";
      }
    }

    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function executeDuality(actor, mod, adv, extraStr) {
      const hope = rollDie(12);
      const fear = rollDie(12);

      let advRoll = 0;
      let advStr = "";
      if (adv === "advantage") {
        advRoll = rollDie(6);
        advStr = ` + 优势[${advRoll}]`;
      } else if (adv === "disadvantage") {
        advRoll = -rollDie(6);
        advStr = ` - 劣势[${Math.abs(advRoll)}]`;
      }

      const extraParsed = parseAndRollExtraDice(extraStr);
      const extraTotal = extraParsed.total;
      const extraFormatted = extraParsed.partsText ? ` + [${extraParsed.partsText}]` : "";

      const total = hope + fear + mod + advRoll + extraTotal;

      let verdict = "";
      let verdictClass = "";
      if (hope === fear) {
        verdict = "大成功";
        verdictClass = "crit";
      } else if (hope > fear) {
        verdict = "希望结果";
        verdictClass = "hope";
      } else {
        verdict = "恐惧结果";
        verdictClass = "fear";
      }

      const formula = `希望[${hope}] + 恐惧[${fear}]${mod >= 0 ? " + " + mod : " - " + Math.abs(mod)}${advStr}${extraFormatted}`;

      document.getElementById("hopeNum").textContent = hope;
      document.getElementById("fearDieNum").textContent = fear;
      document.getElementById("dualityTotal").textContent = total;

      const vEl = document.getElementById("dualityVerdict");
      vEl.textContent = verdict;
      vEl.className = `result-verdict ${verdictClass}`;
      document.getElementById("dualityFormula").textContent = formula;

      pushDiceLog({
        actor: actor || "桌面",
        formula: `二元骰 ${mod >= 0 ? "+" + mod : mod}${extraStr ? " " + extraStr : ""}`,
        result: total,
        detail: formula,
        badgeClass: verdictClass,
        badgeText: verdict
      });
    }

      const mod = parseInt(document.getElementById("dualityMod").value, 10) || 0;
      const adv = document.getElementById("dualityAdv").value;

      executeDuality("战局", mod, adv, extra);
    });

    function selectStdSides(sides) {
      currentStdSides = sides;
      document.querySelectorAll(".std-side-btn").forEach(btn => {
        btn.classList.toggle("active", btn.textContent === `d${sides}`);
      });

    function executeStandard(actor, sides, count, mod, adv) {
      let rolls = [];
      let total = 0;
      let f = `${count}d${sides}`;

      if (sides === 20 && count === 1 && adv !== "normal") {
        const r1 = rollDie(20), r2 = rollDie(20);
        const kept = adv === "advantage" ? Math.max(r1, r2) : Math.min(r1, r2);
        total = kept + mod;
        rolls = [r1, r2];
        f = `1d20 (${adv === "advantage" ? "优势" : "劣势"}: [${r1}, ${r2}] => ${kept})`;
      } else {
        for (let i = 0; i < count; i++) {
          const r = rollDie(sides);
          rolls.push(r);
          total += r;
        }
        total += mod;
      }

      if (mod !== 0) f += `${mod > 0 ? "+" + mod : mod}`;
      const detail = `[${rolls.join(", ")}]${mod !== 0 ? " 加值: " + mod : ""}`;

      document.getElementById("stdTotal").textContent = total;
      document.getElementById("stdFormula").textContent = `${f} = ${total} (${detail})`;

      pushDiceLog({
        actor: actor || "桌面",
        formula: `${count}d${sides}${mod !== 0 ? (mod > 0 ? "+" + mod : mod) : ""}`,
        result: total,
        detail,
        badgeClass: "std",
        badgeText: `d${sides}`
      });
    }

        state.countdowns = [
          { id: "c1", name: "援军抵达", value: 3, max: 4 },
          { id: "c2", name: "仪式反噬", value: 5, max: 6 },
          { id: "c3", name: "遗迹坍塌", value: 2, max: 8 }
        ];
        state.characters = JSON.parse(JSON.stringify(PRESETS));
        state.diceLog = [];
        state.roomLog = [{ text: "战局数据已重置", tag: "", time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) }];
        saveState();
        renderAll();
        showToast("已重置");
      }
    });

    document.getElementById("btnExportAll").addEventListener("click", () => {
      const b = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const u = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = u;
      a.download = `dhol-room-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(u);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        closeDossierModal();
        closeImportModal();
        closeAddClockModal();
        closeDeleteClockModal();
        closeDeletePlayerModal();
      }
    });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderAll() {
      renderFear();
      renderCountdowns();
      renderXCard();
      renderPlayerCards();
      renderRoomHistory();
      renderDiceHistory();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
