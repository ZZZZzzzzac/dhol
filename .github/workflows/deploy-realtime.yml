name: Deploy realtime Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realtime-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run realtime:typecheck
      - run: npm --workspace apps/realtime test
      - name: Deploy dhol-realtime
        run: npm run realtime:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify character delivery preflight on Worker and Pages
        run: node scripts/check-character-ingest-cors.mjs
