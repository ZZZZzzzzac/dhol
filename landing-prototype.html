<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>房间主页 · 瑞士主义极简设计稿</title>

<style>
  /* ========================================================
     SWISS / INTERNATIONAL TYPOGRAPHIC STYLE - ROOM LANDING
     - Zero English, pure Chinese typography
     - Strict 3-column / functional grid
     - High-contrast ink on paper palette
     - Sharp zero-radius geometry & solid hard shadows
     - Elimination of all redundant marketing text
     ======================================================== */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg:              #F4F4F0;
    --surface:         #FFFFFF;
    --surface-subtle:  #ECECE7;
    --surface-alt:     #FAF9F6;
    
    --ink:             #0A0A0A;
    --ink-secondary:   #4A4A45;
    --ink-muted:       #888882;
    
    --blue:            #004BD6;
    --blue-hover:      #0038A8;
    --red:             #E6332A;
    
    --border:          #111111;
    --border-subtle:   #D0D0C8;
    
    --font:            -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --font-mono:       "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    
    --shadow-window:   14px 14px 0px rgba(10, 10, 10, 0.45);
    --shadow-button:   3px 3px 0px var(--border);
  }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  /* 居中主面板容器 */
  .landing-window {
    width: 100%;
    max-width: 860px;
    border: 2px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-window);
    display: flex;
    flex-direction: column;
  }

  /* 顶部状态条 */
  .landing-window__head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: var(--surface-subtle);
    border-bottom: 2px solid var(--border);
  }

  .window-title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .window-title::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--ink);
  }

  /* 核心主体内容区 */
  .landing-window__body {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* 第一分区：玩家身份（全局通行前提） */
  .identity-bar {
    border: 2px solid var(--border);
    background: var(--surface-alt);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-left: 8px solid var(--border);
  }
  .identity-label {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    color: var(--ink);
  }
  .identity-input {
    flex: 1;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 14px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    outline: none;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  .identity-input:focus {
    border-color: var(--blue);
    box-shadow: 2px 2px 0px var(--blue);
  }

  /* 第二分区：三栏功能操作网格 (创建 / 加入 / 恢复) */
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  @media (max-width: 768px) {
    .actions-grid {
      grid-template-columns: 1fr;
    }
    .identity-bar {
      flex-direction: column;
      align-items: stretch;
    }
  }

  /* 单个功能卡片 */
  .action-cell {
    border: 2px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }

  .action-cell__head {
    padding: 10px 14px;
    background: var(--surface-subtle);
    border-bottom: 2px solid var(--border);
  }
  .action-cell__title {
    font-size: 14px;
    font-weight: 800;
    margin: 0;
    color: var(--ink);
  }

  .action-cell__body {
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 16px;
    flex: 1;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--ink-secondary);
  }
  .form-input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    outline: none;
  }
  .form-input:focus {
    border-color: var(--blue);
    box-shadow: 2px 2px 0px var(--blue);
  }
  .form-input--mono {
    font-family: var(--font-mono);
    font-size: 15px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 900;
  }

  /* 自定义文件选择条 */
  .file-picker-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 8px 10px;
    border: 1px dashed var(--border);
    background: var(--surface-alt);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink-secondary);
    transition: background 0.1s;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-picker-btn:hover {
    background: var(--surface-subtle);
    border-color: var(--border);
  }
  .file-picker-input {
    display: none;
  }

  /* 瑞士风格功能按钮 */
  .btn-submit {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    padding: 10px 14px;
    border: 2px solid var(--border);
    background: var(--ink);
    color: var(--surface);
    cursor: pointer;
    border-radius: 0;
    transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
  }
  .btn-submit:hover:not(:disabled) {
    background: var(--blue);
    border-color: var(--blue);
    transform: translateY(-1px);
    box-shadow: 3px 3px 0px var(--border);
  }
  .btn-submit:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: none;
  }
  .btn-submit:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn-submit--outline {
    background: var(--surface);
    color: var(--ink);
  }
  .btn-submit--outline:hover:not(:disabled) {
    background: var(--surface-subtle);
    color: var(--ink);
    border-color: var(--border);
  }

  /* 错误提醒条 */
  .error-bar {
    border: 2px solid var(--red);
    background: #FDEEEC;
    color: var(--red);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 800;
    display: none;
  }
  .error-bar.active {
    display: block;
  }
</style>
</head>
<body>

<main class="landing-window">
  
  <!-- 窗口顶栏 -->
  <header class="landing-window__head">
    <h1 class="window-title">匕首之心在线面板</h1>
  </header>

  <!-- 窗口主区 -->
  <div class="landing-window__body">
    
    <!-- 玩家称呼（全局前提） -->
    <section class="identity-bar">
      <label class="identity-label" for="inp-nickname">你的称呼</label>
      <input
        type="text"
        id="inp-nickname"
        class="identity-input"
        placeholder="请输入称呼（必填）"
        maxlength="24"
        oninput="handleNicknameChange(this.value)"
      />
    </section>

    <!-- 错误提醒 -->
    <aside class="error-bar" id="error-bar" role="alert"></aside>

    <!-- 三栏功能动作区 -->
    <div class="actions-grid">
      
      <!-- 1. 创建新房间 -->
      <section class="action-cell">
        <header class="action-cell__head">
          <h2 class="action-cell__title">创建房间</h2>
        </header>
        <form class="action-cell__body" onsubmit="handleCreate(event)">
          <div class="form-group">
            <input
              type="text"
              id="inp-room-name"
              aria-label="房间名称"
              class="form-input"
              placeholder="未命名房间"
              maxlength="60"
            />
          </div>
          <button type="submit" class="btn-submit" id="btn-create" disabled>创建房间</button>
        </form>
      </section>

      <!-- 2. 加入已有房间 -->
      <section class="action-cell">
        <header class="action-cell__head">
          <h2 class="action-cell__title">加入房间</h2>
        </header>
        <form class="action-cell__body" onsubmit="handleJoin(event)">
          <div class="form-group">
            <input
              type="text"
              id="inp-invite-code"
              aria-label="六位邀请码"
              class="form-input form-input--mono"
              maxlength="6"
              oninput="handleInviteInput(this)"
            />
          </div>
          <button type="submit" class="btn-submit" id="btn-join" disabled>加入房间</button>
        </form>
      </section>

      <!-- 3. 从备份恢复 -->
      <section class="action-cell">
        <header class="action-cell__head">
          <h2 class="action-cell__title">恢复房间</h2>
        </header>
        <form class="action-cell__body" onsubmit="handleRestore(event)">
          <div class="form-group">
            <label class="file-picker-btn" for="inp-backup-file" id="lbl-file-name">
              点击选择备份文件
            </label>
            <input
              type="file"
              id="inp-backup-file"
              class="file-picker-input"
              accept="application/json,.json"
              onchange="handleFileChange(this)"
            />
          </div>
          <button type="submit" class="btn-submit btn-submit--outline" id="btn-restore" disabled>恢复房间</button>
        </form>
      </section>

    </div>

  </div>

</main>

<script>
  let currentNickname = '';
  let currentInviteCode = '';
  let selectedFile = null;

  function handleNicknameChange(val) {
    currentNickname = val.trim();
    updateButtonStates();
  }

  function handleInviteInput(input) {
    input.value = input.value.toUpperCase();
    currentInviteCode = input.value.trim();
    updateButtonStates();
  }

  function handleFileChange(input) {
    const file = input.files && input.files[0];
    const label = document.getElementById('lbl-file-name');
    if (file) {
      selectedFile = file;
      label.textContent = file.name;
    } else {
      selectedFile = null;
      label.textContent = '点击选择备份文件';
    }
    updateButtonStates();
  }

  function updateButtonStates() {
    const hasNickname = currentNickname.length > 0;
    document.getElementById('btn-create').disabled = !hasNickname;
    document.getElementById('btn-join').disabled = !(hasNickname && currentInviteCode.length === 6);
    document.getElementById('btn-restore').disabled = !(hasNickname && selectedFile !== null);
  }

  function handleCreate(e) {
    e.preventDefault();
    const roomName = document.getElementById('inp-room-name').value.trim() || '未命名房间';
    alert(`【演示】创建房间：\n称呼：${currentNickname}\n房间名：${roomName}`);
  }

  function handleJoin(e) {
    e.preventDefault();
    alert(`【演示】加入房间：\n称呼：${currentNickname}\n邀请码：${currentInviteCode}`);
  }

  function handleRestore(e) {
    e.preventDefault();
    alert(`【演示】恢复备份：\n称呼：${currentNickname}\n文件：${selectedFile.name}`);
  }
</script>
</body>
</html>
