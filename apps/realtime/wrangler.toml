name = "dhol-realtime"
main = "src/index.ts"
compatibility_date = "2026-04-28"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[durable_objects.bindings]]
name = "ROOMS_V2"
class_name = "RoomV2DurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[migrations]]
tag = "v2-json-desktop"
new_sqlite_classes = ["RoomV2DurableObject"]

[vars]
ALLOWED_ORIGIN = "https://screenol.pages.dev"
CHARACTER_INGEST_ORIGINS = "https://dhsheet.top"

